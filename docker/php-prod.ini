; Ajustes de produção da API (copiado para conf.d na imagem "prod").
expose_php = Off
memory_limit = 256M
; Fotos de perfil: o UploadController aceita até 5 MB
upload_max_filesize = 6M
post_max_size = 8M

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; O código não muda dentro da imagem: não é preciso conferir a data dos arquivos a cada request
opcache.validate_timestamps = 0
