# Frontend em produção (imagem "prod" do Dockerfile.frontend): SPA estática.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Os arquivos do Vite têm hash no nome: podem ficar em cache para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Arquivos para robôs (llms.txt, robots.txt, .well-known): 404 de verdade quando não existem,
    # em vez do index.html da SPA
    location /.well-known/ {
        try_files $uri =404;
    }
    location ~* \.(txt|json|xml)$ {
        try_files $uri =404;
    }

    # Rotas do vue-router (history mode) caem no index.html, que nunca é cacheado
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
