            ordem:
              type: integer
            preco_anual:
              type: string
            preco_mensal:
              type: string
            recursos:
              type: array
              items:
                type: string
            recursos_list:
              type: array
              items:
                type: string
            role_id:
              type: integer
            updated_at:
              type: string
        plano_id:
          type: integer
        recorrente:
          type: boolean
