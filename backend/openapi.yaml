components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      description: 'Resposta de erro. `errors` traz os detalhes por campo ({ campo: { regra: mensagem } }) nos erros de validação.'
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
    SucessoSemDados:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          nullable: true
    FrasePronuncia:
      type: object
      required:
        - texto
        - origem
      properties:
        texto:
          type: string
        origem:
          type: string
          enum:
            - prompt
            - frase
            - traducao
            - basica
    PronunciaTentativa:
      type: object
      required:
        - id
        - usuario_id
        - frase
        - reconhecido
        - nota
        - criado_em
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        frase:
          type: string
        reconhecido:
          type: string
        nota:
          type: integer
          minimum: 0
          maximum: 100
        criado_em:
          type: string
          format: date-time
    PronunciaResultado:
      type: object
      required:
        - tentativa
        - nota
        - faltando
      properties:
        tentativa:
          $ref: '#/components/schemas/PronunciaTentativa'
        nota:
          type: integer
          minimum: 0
          maximum: 100
        faltando:
          type: array
          description: Palavras esperadas que não apareceram no que foi dito
          items:
            type: string
    PronunciaResumo:
      type: object
      required:
        - total
        - media
        - melhor
        - recentes
      properties:
        total:
          type: integer
        media:
          type: integer
        melhor:
          type: integer
        recentes:
          type: array
          items:
            $ref: '#/components/schemas/PronunciaTentativa'
    Conquista:
      type: object
      required:
        - codigo
        - icone
        - alvo
        - atual
        - conquistada
        - conquistada_em
        - nova
      properties:
        codigo:
          type: string
        icone:
          type: string
        alvo:
          type: integer
        atual:
          type: integer
        conquistada:
          type: boolean
        conquistada_em:
          type: string
          format: date-time
          nullable: true
        nova:
          type: boolean
          description: Conquistada e ainda não vista pelo aluno
    MetaDiaria:
      type: object
      required:
        - meta
        - feitos_hoje
        - sequencia_atual
      properties:
        meta:
          type: integer
        feitos_hoje:
          type: integer
        sequencia_atual:
          type: integer
    NivelamentoEstado:
      type: object
      required:
        - id
        - concluido
        - respondidas
        - total
        - questao
        - resultado
      properties:
        id:
          type: integer
        concluido:
          type: boolean
        respondidas:
          type: integer
        total:
          type: integer
        questao:
          type: object
          nullable: true
          description: Questão atual, sem a alternativa correta
          required:
            - id
            - enunciado
            - alternativas
          properties:
            id:
              type: integer
            enunciado:
              type: string
            alternativas:
              type: array
              items:
                type: string
        resultado:
          allOf:
            - $ref: '#/components/schemas/NivelamentoResultado'
          nullable: true
    NivelamentoResultado:
      type: object
      required:
        - nivel
        - nivel_ingles
        - acertos
        - total
        - concluido_em
        - pode_refazer_em
      properties:
        nivel:
          type: string
          enum:
            - A1
            - A2
            - B1
            - B2
            - C1
        nivel_ingles:
          type: string
          enum:
            - iniciante
            - intermediario
            - avancado
        acertos:
          type: integer
        total:
          type: integer
        concluido_em:
          type: string
          format: date-time
        pode_refazer_em:
          type: string
          format: date-time
    ProgressoHistorico:
      type: object
      required:
        - revisoes_por_dia
        - acertos_por_semana
        - pronuncia_por_semana
        - distribuicao_cards
      properties:
        revisoes_por_dia:
          type: array
          description: Últimos 30 dias, inclusive os sem revisão
          items:
            type: object
            required:
              - dia
              - total
            properties:
              dia:
                type: string
                format: date
              total:
                type: integer
        acertos_por_semana:
          type: array
          description: Últimas 12 semanas (a data é a segunda-feira)
          items:
            type: object
            required:
              - semana
              - total
              - corretas
              - taxa
            properties:
              semana:
                type: string
                format: date
              total:
                type: integer
              corretas:
                type: integer
              taxa:
                type: integer
        pronuncia_por_semana:
          type: array
          items:
            type: object
            required:
              - semana
              - tentativas
              - media
            properties:
              semana:
                type: string
                format: date
              tentativas:
                type: integer
              media:
                type: integer
        distribuicao_cards:
          type: object
          required:
            - novos
            - aprendendo
            - dominados
          properties:
            novos:
              type: integer
            aprendendo:
              type: integer
            dominados:
              type: integer
    AdminUser:
      type: object
      required:
        - criado_em
        - email
        - id
        - nome
        - role
        - status
        - ultimo_login
      properties:
        criado_em:
          type: string
        email:
          type: string
        id:
          type: integer
        nome:
          type: string
        role:
          type: string
        status:
          type: string
        ultimo_login:
          description: 'Só visto nulo nos testes'
          nullable: true
    AdminUserRoleInput:
      type: object
      properties:
        role:
          type: string
        user_id:
          type: integer
    AssinarInput:
      type: object
      properties:
        ciclo:
          type: string
    AssinarResposta:
      type: object
      required:
        - checkout_url
        - requires_payment
      properties:
        assinatura:
          type: object
          required:
            - cancelar_no_fim_periodo
            - created_at
            - data_fim
            - data_inicio
            - id
            - is_ativo
            - payment_gateway
            - payment_id
            - plano
            - plano_id
            - recorrente
            - status
            - stripe_status
            - updated_at
            - usuario_id
          properties:
            cancelar_no_fim_periodo:
              type: boolean
            created_at:
              type: string
            data_fim:
              type: string
              nullable: true
            data_inicio:
              type: string
            id:
              type: integer
            is_ativo:
              type: boolean
            payment_gateway:
              description: 'Só visto nulo nos testes'
              nullable: true
            payment_id:
              description: 'Só visto nulo nos testes'
              nullable: true
            plano:
              type: object
              required:
                - created_at
                - descricao
                - dias_trial
                - id
                - is_ativo
                - limites
                - limites_array
                - nome
                - ordem
                - preco_anual
                - preco_mensal
                - recursos
                - recursos_list
                - role_id
                - updated_at
              properties:
                created_at:
                  type: string
                descricao:
                  type: string
                dias_trial:
                  type: integer
                id:
                  type: integer
                is_ativo:
                  type: boolean
                limites:
                  type: object
                  required:
                    - flashcards
                    - prompts
                    - quizes
                  properties:
                    flashcards:
                      type: integer
                    prompts:
                      type: integer
                    quizes:
                      type: integer
                limites_array:
                  type: object
                  required:
                    - flashcards
                    - prompts
                    - quizes
                  properties:
                    flashcards:
                      type: integer
                    prompts:
                      type: integer
                    quizes:
                      type: integer
                nome:
                  type: string
                ordem:
                  type: integer
                preco_anual:
                  type: string
                preco_mensal:
                  type: string
                recursos:
                  type: array
                  items:
                    type: string
                recursos_list:
                  type: array
                  items:
                    type: string
                role_id:
                  type: integer
                updated_at:
                  type: string
            plano_id:
              type: integer
            recorrente:
              type: boolean
            status:
              type: string
            stripe_status:
              description: 'Só visto nulo nos testes'
              nullable: true
            updated_at:
              type: string
            usuario_id:
              type: integer
        checkout_url:
          type: string
          nullable: true
        requires_payment:
          type: boolean
    Assinatura:
      type: object
      required:
        - cancelar_no_fim_periodo
        - created_at
        - data_fim
        - data_inicio
        - id
        - is_ativo
        - payment_gateway
        - payment_id
        - plano
        - plano_id
        - recorrente
        - status
        - stripe_status
        - updated_at
        - usuario_id
      properties:
        cancelar_no_fim_periodo:
          type: boolean
        created_at:
          type: string
        data_cancelamento:
          description: 'Só visto nulo nos testes'
          nullable: true
        data_fim:
          type: string
          nullable: true
        data_inicio:
          type: string
        id:
          type: integer
        is_ativo:
          type: boolean
        payment_gateway:
          type: string
          nullable: true
        payment_id:
          type: string
          nullable: true
        plano:
          type: object
          required:
            - created_at
            - descricao
            - dias_trial
            - id
            - is_ativo
            - limites
            - limites_array
            - nome
            - ordem
            - preco_anual
            - preco_mensal
            - recursos
            - recursos_list
            - role_id
            - updated_at
          properties:
