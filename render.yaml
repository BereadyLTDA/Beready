# Blueprint do Render (item 1 do roadmap do TCC). No painel do Render: New > Blueprint, escolha
# este repositório e preencha as variáveis marcadas como "sync: false" (o Render pede cada uma na
# criação). O passo a passo completo está em docs/deploy-render.md.
#
# Três serviços:
#   - beready-api: API Laravel (Octane + FrankenPHP) a partir do Dockerfile.backend. O estágio
#     "prod" é o último do arquivo, então é o que o Render constrói.
#   - beready-lembretes: cron job que manda o lembrete de estudo por e-mail todo dia às 18h de
#     Brasília (21h UTC). Usa a mesma imagem e as mesmas variáveis da API.
#   - beready-web: frontend Vue publicado como site estático.

envVarGroups:
  - name: beready-api
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEFAULT_TIMEZONE
        value: America/Sao_Paulo
      - key: APP_LOCALE
        value: pt_BR
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Gere com: php artisan key:generate --show (o valor começa com base64:)
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # URL da API, ex.: https://beready-api.onrender.com
      - key: APP_URL
        sync: false
      # URL do frontend terminando em "/", ex.: https://beready-web.onrender.com/
      - key: APP_BASE_URL
        sync: false
      # URL do frontend sem a "/" final, ex.: https://beready-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Supabase: use a string de conexão do pooler (porta 6543) com a senha NOVA
      - key: DATABASE_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      # Frontend e API em domínios diferentes (*.onrender.com é tratado como sites distintos)
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: None
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: BeReady
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Login social (opcional): deixe em branco os provedores que não for usar
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SENTRY_LARAVEL_DSN
        sync: false

services:
  - type: web
    name: beready-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      # O Render encaminha o tráfego para a porta em PORT; a imagem escuta na 8765
      - key: PORT
        value: "8765"
      - fromGroup: beready-api

  - type: cron
    name: beready-lembretes
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    schedule: "0 21 * * *"
    dockerCommand: php artisan beready:lembretes
    envVars:
      - fromGroup: beready-api

  - type: web
    name: beready-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Rotas do vue-router (history mode). Arquivos que existem (assets, robots.txt...) são
      # servidos antes desta regra.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL da API, ex.: https://beready-api.onrender.com
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_ENV
        value: production
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
      - key: VITE_CONTATO_EMAIL
        sync: false
